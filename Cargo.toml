[package]
name = "loci"
version = "0.3.1"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "rustls", "json", "query"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "location"] }
ferrostar = { version = "0.58", default-features = false, features = ["std"] }
geo = "0.33"
polyline = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_9"]

[dependencies.shumate]
package = "libshumate"
version = "0.8"
features = ["v1_7"]

[profile.release]
strip = true
lto = true
opt-level = "s"
